name: Vendor BKE.Desktop.Client

on:
  push:
    branches:
      - feat/gui-certification-demo-app
    paths:
      - .github/workflows/vendor-desktop-sdk.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download certified SDK package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          curl --fail --location --silent --show-error \
            https://github.com/jan2xo/bke-desktop-sdk/releases/download/v1.0.0/BKE.Desktop.Client.1.0.0.nupkg \
            --output packages/BKE.Desktop.Client.1.0.0.nupkg
          echo "9cd80194bc0ddb5f1f983143d37282f470cfb7772e41fa2d9df691f48425071e  packages/BKE.Desktop.Client.1.0.0.nupkg" | sha256sum --check --strict

      - name: Commit exact package bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f packages/BKE.Desktop.Client.1.0.0.nupkg
          if git diff --cached --quiet; then
            echo "Certified SDK package already vendored."
            exit 0
          fi
          git commit -m "chore: vendor BKE.Desktop.Client 1.0.0"
          git push origin HEAD:feat/gui-certification-demo-app
