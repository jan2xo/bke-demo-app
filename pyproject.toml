[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bke-demo-app"
version = "1.0.0"
description = "Permanent GUI certification app for the BKE Licensing Agent product boundary"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bke-demo-app = "bke_demo_app.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
